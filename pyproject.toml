[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonlithy-eval"
version = "0.1.0"
description = "Small reproducible Python coding evaluation harness"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
sonlithy-eval = "sonlithy_eval.cli:main"

[tool.setuptools.packages.find]
include = ["sonlithy_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]